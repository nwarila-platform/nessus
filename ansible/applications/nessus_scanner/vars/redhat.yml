#
# RedHat-family overlay merged over nessus_scanner_defaults by the v3 loader.
#
# The role supports one family, and the vendor's RPM installs to the same paths on every release
# of it, so the defaults are already the RedHat values and this overlay carries nothing. It exists
# because the loader resolves an OS overlay per family; an empty map is the honest statement that
# this family needs no override, rather than a duplicate of defaults that would drift.
