# ============================================================================================= #
# File: '{{ role_path }}/tasks/clean_redhat.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# state=clean removes what the product accumulates without being asked: every certificate import
# leaves a timestamped copy of the material it replaced beside the live files
# (servercert.pem.<epoch>, serverkey.pem.<epoch>, measured 2026-09-30), and those include
# superseded PRIVATE keys. The product, its data and its configuration are untouched;
# uninstalling is state=absent.
#
# ============================================================================================= #
---

#region ------ [ Process: Remove The Superseded Certificate Material ] ------------------------ #

- name: 'PROCESS | Find The Superseded Certificate Material'
  register: '__nessus_scanner_superseded__'

  ansible.builtin.find:
    file_type: 'file'
    paths:
      - "{{ nessus_scanner_running.served_certificate_path | dirname }}"
      - "{{ nessus_scanner_running.install_root }}/var/nessus/CA"
    patterns: [ '*.pem.[0-9]*' ]
    recurse: false

# --------------------------------------------------------------------------------------------- #

- name: 'PROCESS | Remove The Superseded Certificate Material'
  loop: "{{ __nessus_scanner_superseded__.files | map(attribute='path') | list }}"

  ansible.builtin.file:
    path: "{{ item }}"
    state: 'absent'

#endregion --- [ Process: Remove The Superseded Certificate Material ] ------------------------ #
