# =========================================================================================== #
# File: '{{ role_path }}/tasks/present_redhat.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Converges a RHEL 8 host into a registered, HTTPS-serving Nessus scanner, then proves it.
#
#   00 label the install root (its own data volume)   06 import the declared HTTPS certificate
#   01 trust the vendor signing key                   07 the one administrator account
#   02 adopt the volume's scanner, or install one     08 register and fetch the plugins
#   03 start the service                              09 wait until ready -- over HTTPS validated
#   04 converge every setting                            against the declared CA and hostname
#   05 admit the listener in firewalld                10 prove the account by signing in
#                                                     11 verify the whole result against the machine
#
# A converged host changes nothing: every step reads first and writes only on difference.
#
# STIG CONSTRAINTS THIS FILE IS SHAPED BY
#   * fapolicyd denies an interpreter opening an untrusted script, so nothing here stages a
#     module as a file: no async (async_wrapper runs a staged copy). The inventory pipelines.
#   * /tmp, /var/tmp and /home are noexec. Nothing staged here is executed -- rpm and OpenSSL
#     read their inputs -- so the loader's temporary directory serves.
#   * FIPS mode: the certificate bundle is decoded by the system OpenSSL, the FIPS-validated
#     module, so a bundle this host's crypto policy would refuse fails here, by name.
#
# =========================================================================================== #
---
- name: 'PROCESS | Converge The Nessus Scanner'
  vars:
    __nessus_scanner_cli__: "{{ nessus_scanner_running.cli_path }}"
    __nessus_scanner_openssl__: "{{ nessus_scanner_running.openssl_path }}"
    __nessus_scanner_port__: "{{ nessus_scanner_running.listener.port | int }}"
    __nessus_scanner_key_id__: "{{ nessus_scanner_running.signing_key.fingerprint[-8:] | lower }}"
    __nessus_scanner_rpm__: >-
      {{ nessus_scanner_running.installer.key | basename
         | replace('<version>', nessus_scanner_running.installer.version) }}
    # The one port setting has one source, listener.port; validate.yml refuses a second.
    __nessus_scanner_settings__: >-
      {{ nessus_scanner_running.settings
         | combine({'xmlrpc_listen_port': nessus_scanner_running.listener.port | string}) }}
    # The settings this role converges: every declared one except those left to Nessus (~).
    __nessus_scanner_managed__: >-
      {{ __nessus_scanner_settings__ | dict2items | rejectattr('value', 'none') | items2dict }}
    # Settings Nessus 10.12.4 stores at install without listing them in its own catalogue
    # (measured 2026-10-01). They are real, so declaring them is not a typo.
    __nessus_scanner_uncatalogued__:
      - 'bw_permanent_blackout_window'
      - 'bw_prevent_agent_scans'
      - 'bw_prevent_core_updates'
      - 'bw_prevent_plugin_updates'
      - 'track_unique_agents'
    __nessus_scanner_pem__:
      key: "{{ __temp_dir__.path }}/nessus-https-key.pem"
      certificate: "{{ __temp_dir__.path }}/nessus-https-certificate.pem"
      ca: "{{ __temp_dir__.path }}/nessus-https-ca.pem"
    __nessus_scanner_base_url__: "https://localhost:{{ nessus_scanner_running.listener.port | int }}"
    # What makes an install root one particular scanner, relative to the root: the
    # installation's UUID and the key its stored secrets are encrypted with. Nessus writes both
    # on its first start (measured 2026-09-30).
    __nessus_scanner_identity__: [ 'var/nessus/uuid', 'var/nessus/master.key' ]
  block:

    #region ------ [ Begin: Create The Controller Staging Directory ] ----------------------- #

    - name: 'BEGIN | Create The Controller Staging Directory'
      become: false
      changed_when: false
      check_mode: false
      delegate_to: 'localhost'
      register: '__nessus_scanner_stage__'
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

      ansible.builtin.tempfile:
        path: '/tmp'
        prefix: 'nessus-scanner-'
        state: 'directory'
        suffix: ''

    #endregion --- [ Begin: Create The Controller Staging Directory ] ----------------------- #

    #region ------ [ Process: 00 Label The Install Root ] ----------------------------------- #
    # The install root is normally its own data volume, mounted by linux_disk_manager so the
    # scanner's data outlives the OS disk. A filesystem made for it carries no SELinux labels, so
    # the mount point shows that filesystem's unlabelled root rather than the label policy
    # expects there. restorecon labels THAT DIRECTORY, not the tree: the package labels its own
    # files as it installs them, and Nessus renames files it downloads across directories whose
    # policy labels differ, so a recursive relabel finds drift after every plugin update and
    # never settles (measured 2026-09-30: the second converge relabelled again). Nessus runs
    # unconfined, so those labels change nothing it can reach.

    - name: 'BEGIN | Read Whether SELinux Is Enabled'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_selinux__'

      ansible.builtin.command:
        argv: [ 'selinuxenabled' ]

    - name: 'BEGIN | Read Whether The Install Root Exists'
      register: '__nessus_scanner_root__'

      ansible.builtin.stat:
        get_checksum: false
        path: "{{ nessus_scanner_running.install_root }}"

    - name: 'PROCESS | Apply The SELinux Labels Under The Install Root'
      changed_when: __nessus_scanner_relabel__.stdout | length > 0
      register: '__nessus_scanner_relabel__'
      when:
        - __nessus_scanner_selinux__.rc == 0
        - __nessus_scanner_root__.stat.exists

      ansible.builtin.command:
        argv: [ 'restorecon', '-v', "{{ nessus_scanner_running.install_root }}" ]

    #endregion --- [ Process: 00 Label The Install Root ] ----------------------------------- #

    #region ------ [ Process: 01 Trust The Vendor Signing Key ] ----------------------------- #
    # RPM records an imported key as gpg-pubkey-<last 8 hex of the fingerprint>; asking for that
    # name is how a converged host skips the import. rpm_key then refuses the shipped key unless
    # its fingerprint is the pinned one.

    - name: 'BEGIN | Read Whether The Vendor Signing Key Is Trusted'
      changed_when: false
      failed_when: __nessus_scanner_key_query__.rc not in [0, 1]
      register: '__nessus_scanner_key_query__'

      ansible.builtin.command:
        argv: [ 'rpm', '-q', "gpg-pubkey-{{ __nessus_scanner_key_id__ }}" ]

    - name: 'PROCESS | Stage The Vendor Signing Key'
      changed_when: false
      when: __nessus_scanner_key_query__.rc != 0

      ansible.builtin.copy:
        dest: "{{ __temp_dir__.path }}/{{ nessus_scanner_running.signing_key.file }}"
        group: 'root'
        mode: '0600'
        owner: 'root'
        src: "{{ nessus_scanner_running.signing_key.file }}"

    - name: 'PROCESS | Trust The Vendor Signing Key'
      when: __nessus_scanner_key_query__.rc != 0

      ansible.builtin.rpm_key:
        fingerprint: "{{ nessus_scanner_running.signing_key.fingerprint }}"
        key: "{{ __temp_dir__.path }}/{{ nessus_scanner_running.signing_key.file }}"
        state: 'present'
        validate_certs: true

    #endregion --- [ Process: 01 Trust The Vendor Signing Key ] ----------------------------- #

    #region ------ [ Process: 02 Adopt The Volume's Scanner, Or Install One ] --------------- #
    # The rule every application in the fleet follows: if the data volume already holds the
    # application, ADOPT it; otherwise INSTALL it. The volume holds a scanner when any part of a
    # scanner's identity is there, and three cases follow:
    #   install  no identity on the volume: a fresh scanner is installed onto it.
    #   adopt    an identity this OS has never run -- the OS was replaced under the volume. The
    #            package is reinstalled over the existing tree, and everything else is kept.
    #   in use   the identity of the scanner this OS already runs.
    # Whenever a package transaction runs over an identity, that identity is read before and
    # after it and must come through byte for byte: a transaction that changed it would start a
    # different scanner on the adopted data. That stops here, by name, before the service starts.
    #
    # The package is installed only when the installed version differs from the pin. The digest
    # proves the bytes are the ones pinned; the signature proves the vendor built them. Both are
    # checked on the guest copy -- the one dnf installs -- and dnf checks the signature again
    # under the host's own policy. allow_downgrade because the pin is authoritative both ways.

    - name: 'BEGIN | Read The Identity Of The Scanner The Volume Holds'
      loop: "{{ __nessus_scanner_identity__ }}"
      register: '__nessus_scanner_identity_before__'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        get_checksum: true
        path: "{{ nessus_scanner_running.install_root }}/{{ item }}"

    - name: 'BEGIN | Decide Whether To Adopt The Volume Or Install'
      vars:
        __installed_versions__: >-
          {{ (ansible_facts.packages | default({}))[nessus_scanner_running.package_name]
             | default([]) | map(attribute='version') | list }}
        __identity_found__: >-
          {{ __nessus_scanner_identity_before__.results
             | selectattr('stat.exists') | list | length > 0 }}
      ansible.builtin.set_fact:
        __nessus_scanner_install_required__: >-
          {{ __installed_versions__ != [nessus_scanner_running.installer.version] }}
        __nessus_scanner_data_action__: >-
          {{ 'install' if not (__identity_found__ | bool)
             else 'in use' if __installed_versions__ | length > 0
             else 'adopt' }}
        cacheable: false

    - name: 'INFO | Report Whether The Volume Is Adopted Or Installed'
      ansible.builtin.debug:
        msg: >-
          {{ {'install': 'The data volume holds no scanner: installing one onto it.',
              'adopt': 'The data volume holds a scanner this OS has never run: adopting it,'
                       ~ ' with the package reinstalled over it.',
              'in use': 'The data volume holds the scanner this OS already runs.'}
             [__nessus_scanner_data_action__] }}

    - name: 'PROCESS | Stage The Installer'
      when: __nessus_scanner_install_required__ | bool
      vars:
        __nessus_scanner_artifact_bucket__: "{{ nessus_scanner_running.installer.bucket }}"
        __nessus_scanner_artifact_key__: >-
          {{ nessus_scanner_running.installer.key
             | replace('<version>', nessus_scanner_running.installer.version) }}
        __nessus_scanner_artifact_sha256__: "{{ nessus_scanner_running.installer.sha256 }}"
        __nessus_scanner_artifact_file__: "{{ __nessus_scanner_rpm__ }}"

      ansible.builtin.include_tasks:
        file: 'stage_artifact.yml'

    - name: 'VERIFY | Read The Installer Signature'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_signature__'
      when: __nessus_scanner_install_required__ | bool

      ansible.builtin.command:
        argv: [ 'rpm', '--checksig', "{{ __temp_dir__.path }}/{{ __nessus_scanner_rpm__ }}" ]

    - name: 'VERIFY | Require The Vendor Signature'
      when: __nessus_scanner_install_required__ | bool
      ansible.builtin.assert:
        that:
          - __nessus_scanner_signature__.rc == 0
          - __nessus_scanner_signature__.stdout is search('signatures OK')
        fail_msg: >-
          rpm --checksig did not report a good vendor signature on {{ __nessus_scanner_rpm__ }}:
          {{ __nessus_scanner_signature__.stdout | default('') }}
          {{ __nessus_scanner_signature__.stderr | default('') }}
        quiet: true

    - name: 'PROCESS | Install The Pinned Version From The Verified Copy'
      when: __nessus_scanner_install_required__ | bool

      ansible.builtin.dnf:
        allow_downgrade: true
        disable_gpg_check: false
        name: "{{ __temp_dir__.path }}/{{ __nessus_scanner_rpm__ }}"
        state: 'present'

    - name: 'VERIFY | Read The Identity Again After The Package Transaction'
      loop: "{{ __nessus_scanner_identity__ }}"
      register: '__nessus_scanner_identity_after__'
      when:
        - __nessus_scanner_install_required__ | bool
        - __nessus_scanner_data_action__ != 'install'

      ansible.builtin.stat:
        checksum_algorithm: 'sha256'
        get_checksum: true
        path: "{{ nessus_scanner_running.install_root }}/{{ item }}"

    # Tripwire against a packaging change: each part of the identity that was there before the
    # transaction is still there after it, byte for byte.
    - name: 'VERIFY | Require The Package Transaction To Keep The Identity'
      loop: >-
        {{ __nessus_scanner_identity_before__.results
           | zip(__nessus_scanner_identity_after__.results | default([])) | list }}
      loop_control:
        label: "{{ item.0.item }}"
      when:
        - __nessus_scanner_install_required__ | bool
        - __nessus_scanner_data_action__ != 'install'
        - item.0.stat.exists

      ansible.builtin.assert:
        that:
          - item.1.stat.exists | default(false)
          - item.1.stat.checksum | default('') == item.0.stat.checksum
        fail_msg: >-
          Installing the package over the scanner on the data volume changed or removed
          {{ nessus_scanner_running.install_root }}/{{ item.0.item }}. Refusing to start a
          scanner whose identity the package transaction altered.
        quiet: true

    - name: 'PROCESS | Refresh The Installed Package Facts'
      when: __nessus_scanner_install_required__ | bool

      ansible.builtin.package_facts:
        manager: 'auto'

    # The package's own post-install step EXECUTES a binary it unpacked moments earlier -- its
    # bundled OpenSSL, writing the FIPS module configuration. fapolicyd trusts a file by its RPM
    # digest only once it has learned of it, so on a STIG host that step can be denied mid-
    # transaction. Refreshing the trust database and then checking for the file the step writes
    # turns a silent partial install into either a repaired one or a named failure.
    - name: 'BEGIN | Read Whether fapolicyd Is Running'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_fapolicyd__'

      ansible.builtin.command:
        argv: [ 'systemctl', 'is-active', 'fapolicyd' ]

    - name: 'PROCESS | Refresh The fapolicyd Trust Database After The Install'
      changed_when: true
      when:
        - __nessus_scanner_install_required__ | bool
        - __nessus_scanner_fapolicyd__.stdout | default('') | trim == 'active'

      ansible.builtin.command:
        argv: [ 'fapolicyd-cli', '--update' ]

    - name: 'BEGIN | Read Whether The Vendor FIPS Module Is Configured'
      register: '__nessus_scanner_fips_module__'

      ansible.builtin.stat:
        get_checksum: false
        path: "{{ nessus_scanner_running.install_root }}/etc/nessus/fipsmodule.cnf"

    # The vendor's own command, exactly as its post-install step runs it.
    - name: 'PROCESS | Complete The Vendor FIPS Module Installation'
      changed_when: true
      environment:
        OPENSSL_CONF: "{{ nessus_scanner_running.install_root }}/etc/"
      when: not (__nessus_scanner_fips_module__.stat.exists and __nessus_scanner_fips_module__.stat.size > 0)

      ansible.builtin.command:
        argv:
          - "{{ nessus_scanner_running.install_root }}/bin/openssl"
          - 'fipsinstall'
          - '-out'
          - "{{ nessus_scanner_running.install_root }}/etc/nessus/fipsmodule.cnf"
          - '-module'
          - "{{ nessus_scanner_running.install_root }}/lib/nessus/fips.so"
          - '-self_test_oninstall'

    #endregion --- [ Process: 02 Adopt The Volume's Scanner, Or Install One ] --------------- #

    #region ------ [ Process: 03 Start The Service ] ---------------------------------------- #
    # Started here, before anything is configured, because the product's settings store does not
    # exist until the service has run once.

    - name: 'PROCESS | Enable And Start The Scanner Service'
      ansible.builtin.systemd_service:
        enabled: true
        name: "{{ nessus_scanner_running.service_name }}"
        state: 'started'

    # measured 2026-09-30: 'nessuscli fix' answers "global.db is not yet initialized" for tens of
    # seconds after a first start. A value read back is the only proof the store is up.
    - name: 'BEGIN | Wait For The Settings Store'
      changed_when: false
      delay: "{{ nessus_scanner_running.timeouts.settings_pause_seconds | int }}"
      failed_when: false
      register: '__nessus_scanner_store__'
      retries: "{{ nessus_scanner_running.timeouts.settings_attempts | int }}"
      until:
        - __nessus_scanner_store__.rc == 0
        - __nessus_scanner_store__.stdout is search('The current value for')

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'fix', '--get', 'ssl_mode' ]

    - name: 'VERIFY | Require The Settings Store'
      ansible.builtin.assert:
        that: __nessus_scanner_store__.stdout is search('The current value for')
        fail_msg: >-
          The Nessus settings store never answered: {{ __nessus_scanner_store__.stdout | default('') }}
        quiet: true

    #endregion --- [ Process: 03 Start The Service ] ---------------------------------------- #

    #region ------ [ Process: 04 Converge Every Setting ] ------------------------------------ #
    # Every setting this Nessus has is declared: the role's defaults name each one at the
    # product's own value, the playbook overrides any of them by name, and ~ leaves one to Nessus.
    # 'fix --set' stores ANY name (measured: an unknown name is stored as readily as a real one),
    # so a declared name this Nessus does not have is refused here instead of being kept silently.
    # Read once; write only what differs; read back.

    - name: 'BEGIN | Read Every Setting'
      ansible.builtin.include_tasks:
        file: 'read_settings.yml'

    - name: 'VERIFY | Refuse A Setting This Nessus Does Not Have'
      vars:
        __unknown__: >-
          {{ __nessus_scanner_managed__ | list
             | difference(__nessus_scanner_settings_known__ + __nessus_scanner_uncatalogued__)
             | reject('match', '^timeout[.][0-9]+$') | list }}
      ansible.builtin.assert:
        that: __unknown__ | length == 0
        fail_msg: >-
          Nessus {{ nessus_scanner_running.installer.version }} has no setting named
          {{ __unknown__ | join(', ') }}. 'fix --set' would store it anyway and nothing would
          read it, so correct the name or remove it from the declaration.
        quiet: true

    # A version bump can add settings. They stay at the product's values until declared, and this
    # names them so the declaration can catch up.
    - name: 'INFO | Report Settings This Nessus Has That Are Not Declared'
      vars:
        __undeclared__: >-
          {{ __nessus_scanner_settings_known__ | difference(__nessus_scanner_settings__ | list)
             | reject('match', '^timeout[.]') | list }}
      when: __undeclared__ | length > 0
      ansible.builtin.debug:
        msg: >-
          Nessus has settings this role does not declare, so they keep the product's own values:
          {{ __undeclared__ | join(', ') }}. Declare them in the role defaults to manage them.

    - name: 'PROCESS | Write The Settings That Differ'
      changed_when: true
      loop: "{{ __nessus_scanner_settings_differ__ }}"
      notify: 'nessus-restart-required'

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'fix', '--set', "{{ item }}={{ __nessus_scanner_managed__[item] }}" ]

    - name: 'VERIFY | Read Every Setting Again'
      when: __nessus_scanner_settings_differ__ | length > 0
      ansible.builtin.include_tasks:
        file: 'read_settings.yml'

    - name: 'VERIFY | Require Every Managed Setting To Hold Its Declared Value'
      ansible.builtin.assert:
        that: __nessus_scanner_settings_differ__ | length == 0
        fail_msg: >-
          Nessus did not keep the declared value of {{ __nessus_scanner_settings_differ__ | join(', ') }}
          after it was written. The value may be outside what the setting accepts; see
          'nessuscli fix --show <name>' for its options.
        quiet: true

    #endregion --- [ Process: 04 Converge Every Setting ] ------------------------------------ #

    #region ------ [ Process: 05 Admit The Listener In firewalld ] -------------------------- #
    # Every ACTIVE zone, because a zone is active only while it holds an interface or source,
    # and the listener must answer on whichever one the scanner's clients arrive through. The
    # permanent rule is the declaration; the reload makes it the running one.

    - name: 'BEGIN | Read Whether firewalld Is Running'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_firewalld__'
      when: nessus_scanner_running.firewall.manage | bool

      ansible.builtin.command:
        argv: [ 'firewall-cmd', '--state' ]

    - name: 'PROCESS | Admit The Listener In Each Active Zone'
      when:
        - nessus_scanner_running.firewall.manage | bool
        - __nessus_scanner_firewalld__.rc | default(1) == 0
      block:
        - name: 'BEGIN | Read The Active Zones'
          changed_when: false
          register: '__nessus_scanner_zones_read__'

          ansible.builtin.command:
            argv: [ 'firewall-cmd', '--get-active-zones' ]

        # A zone's name is the first word of an unindented line; the indented lines under it
        # list its interfaces and sources.
        - name: 'BEGIN | Record The Active Zones'
          ansible.builtin.set_fact:
            __nessus_scanner_zones__: >-
              {{ __nessus_scanner_zones_read__.stdout_lines | reject('match', '^[ ]')
                 | map('trim') | reject('equalto', '') | map('split') | map('first') | list }}
            cacheable: false

        - name: 'VERIFY | Require At Least One Active Zone'
          ansible.builtin.assert:
            that: __nessus_scanner_zones__ | length > 0
            fail_msg: 'firewalld is running with no active zone; the listener would answer nowhere.'
            quiet: true

        - name: 'BEGIN | Read Whether Each Zone Admits The Listener'
          changed_when: false
          failed_when: __nessus_scanner_zone_query__.rc not in [0, 1]
          loop: "{{ __nessus_scanner_zones__ }}"
          register: '__nessus_scanner_zone_query__'

          ansible.builtin.command:
            argv: [ 'firewall-cmd', '--permanent', "--zone={{ item }}",
                    "--query-port={{ __nessus_scanner_port__ }}/tcp" ]

        - name: 'PROCESS | Admit The Listener Permanently'
          changed_when: true
          loop: "{{ __nessus_scanner_zone_query__.results | selectattr('rc', 'equalto', 1) | list }}"
          loop_control:
            label: "{{ item.item }}"
          register: '__nessus_scanner_zone_added__'

          ansible.builtin.command:
            argv: [ 'firewall-cmd', '--permanent', "--zone={{ item.item }}",
                    "--add-port={{ __nessus_scanner_port__ }}/tcp" ]

        - name: 'PROCESS | Load The Permanent Rules'
          changed_when: true
          when: __nessus_scanner_zone_added__ is changed

          ansible.builtin.command:
            argv: [ 'firewall-cmd', '--reload' ]

        - name: 'VERIFY | Require Each Running Zone To Admit The Listener'
          changed_when: false
          loop: "{{ __nessus_scanner_zones__ }}"

          ansible.builtin.command:
            argv: [ 'firewall-cmd', "--zone={{ item }}", "--query-port={{ __nessus_scanner_port__ }}/tcp" ]

    - name: 'INFO | Report That No Local Firewall Is Running'
      when:
        - nessus_scanner_running.firewall.manage | bool
        - __nessus_scanner_firewalld__.rc | default(1) != 0
      ansible.builtin.debug:
        msg: >-
          firewalld is not running on {{ inventory_hostname }}, so there is no local filter to
          open for port {{ __nessus_scanner_port__ }}. A STIG host runs firewalld; this one does
          not.

    #endregion --- [ Process: 05 Admit The Listener In firewalld ] -------------------------- #

    #region ------ [ Process: 06 Import The Declared HTTPS Certificate ] --------------------- #
    # The bundle is decoded on the guest by the system OpenSSL, the FIPS-validated module, with
    # its password on stdin so it never appears in a process list. The key, the certificate and
    # the CA are then checked as a set -- the key opens the certificate, the CA signed it, it is
    # in date, and it names this host and localhost -- BEFORE Nessus is told about any of it.
    # Imported only when what Nessus serves differs: each import leaves a timestamped backup of
    # the previous material behind (measured 2026-09-30), so a converge that re-imported would
    # both report a change and accumulate files.

    - name: 'PROCESS | Stage The Certificate Bundle'
      vars:
        __nessus_scanner_artifact_bucket__: "{{ nessus_scanner_running.certificate.bucket }}"
        __nessus_scanner_artifact_key__: "{{ nessus_scanner_running.certificate.key }}"
        __nessus_scanner_artifact_sha256__: "{{ nessus_scanner_running.certificate.sha256 }}"
        __nessus_scanner_artifact_file__: 'nessus-https.p12'

      ansible.builtin.include_tasks:
        file: 'stage_artifact.yml'

    - name: 'PROCESS | Decode And Import The Certificate'
      block:
        - name: 'PROCESS | Decode The Bundle'
          changed_when: false
          loop:
            - { part: 'key', args: [ '-nocerts', '-nodes' ] }
            - { part: 'certificate', args: [ '-nokeys', '-clcerts' ] }
            - { part: 'ca', args: [ '-nokeys', '-cacerts' ] }
          loop_control:
            label: "{{ item.part }}"
          no_log: true
          register: '__nessus_scanner_decoded__'

          ansible.builtin.command:
            argv: "{{ [__nessus_scanner_openssl__, 'pkcs12', '-in', __temp_dir__.path ~ '/nessus-https.p12',
                     '-passin', 'stdin', '-out', __nessus_scanner_pem__[item.part] ~ '.bag']
                     + item.args }}"
            stdin: "{{ nessus_scanner_running.certificate.password | string | trim }}"
            stdin_add_newline: true

        # Written without the attribute headers PKCS#12 export adds, which some consumers refuse.
        - name: 'PROCESS | Normalize The Decoded Parts'
          changed_when: false
          loop:
            - { part: 'key', command: 'pkey' }
            - { part: 'certificate', command: 'x509' }
            - { part: 'ca', command: 'x509' }
          loop_control:
            label: "{{ item.part }}"

          ansible.builtin.command:
            argv: [ "{{ __nessus_scanner_openssl__ }}", "{{ item.command }}",
                    '-in', "{{ __nessus_scanner_pem__[item.part] }}.bag",
                    '-out', "{{ __nessus_scanner_pem__[item.part] }}" ]

        - name: 'BEGIN | Count The CA Certificates In The Bundle'
          changed_when: false
          failed_when: false
          register: '__nessus_scanner_ca_count__'

          ansible.builtin.command:
            argv: [ 'grep', '-c', '--', '-----BEGIN CERTIFICATE-----', "{{ __nessus_scanner_pem__.ca }}.bag" ]

        - name: 'BEGIN | Read The Certificate Against Its Key, Its CA, The Clock And Its Names'
          changed_when: false
          failed_when: false
          loop:
            - { check: 'chain', argv: [ 'verify', '-CAfile', "{{ __nessus_scanner_pem__.ca }}",
                                        "{{ __nessus_scanner_pem__.certificate }}" ] }
            - { check: 'certificate-public-key', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.certificate }}",
                                                         '-noout', '-pubkey' ] }
            - { check: 'key-public-key', argv: [ 'pkey', '-in', "{{ __nessus_scanner_pem__.key }}", '-pubout' ] }
            - { check: 'in-date', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.certificate }}",
                                          '-noout', '-checkend', '86400' ] }
            - { check: 'names-localhost', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.certificate }}",
                                                  '-noout', '-checkhost', 'localhost' ] }
            - { check: 'names-host', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.certificate }}",
                                             '-noout', '-checkhost', "{{ inventory_hostname }}" ] }
            - { check: 'declared-fingerprint', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.certificate }}",
                                                       '-noout', '-fingerprint', '-sha256' ] }
            - { check: 'declared-ca-fingerprint', argv: [ 'x509', '-in', "{{ __nessus_scanner_pem__.ca }}",
                                                          '-noout', '-fingerprint', '-sha256' ] }
            - { check: 'served-fingerprint', argv: [ 'x509', '-in', "{{ nessus_scanner_running.served_certificate_path }}",
                                                     '-noout', '-fingerprint', '-sha256' ] }
            - { check: 'served-ca-fingerprint', argv: [ 'x509', '-in', "{{ nessus_scanner_running.served_ca_path }}",
                                                        '-noout', '-fingerprint', '-sha256' ] }
          loop_control:
            label: "{{ item.check }}"
          register: '__nessus_scanner_certificate_read__'

          ansible.builtin.command:
            argv: "{{ [__nessus_scanner_openssl__] + item.argv }}"

        - name: 'BEGIN | Record The Certificate Readings'
          ansible.builtin.set_fact:
            __nessus_scanner_certificate__: >-
              {{ dict(__nessus_scanner_certificate_read__.results | map(attribute='item.check')
                      | zip(__nessus_scanner_certificate_read__.results)) }}
            cacheable: false

        - name: 'VERIFY | Require A Usable Certificate Set'
          vars:
            __nessus_scanner_readings__: "{{ __nessus_scanner_certificate__ }}"
          ansible.builtin.assert:
            that:
              - __nessus_scanner_decoded__.results | map(attribute='rc') | select('ne', 0) | list | length == 0
              - __nessus_scanner_ca_count__.stdout | default('0') | trim == '1'
              - __nessus_scanner_readings__['chain'].rc == 0
              - __nessus_scanner_readings__['certificate-public-key'].rc == 0
              - __nessus_scanner_readings__['certificate-public-key'].stdout == __nessus_scanner_readings__['key-public-key'].stdout
              - __nessus_scanner_readings__['in-date'].rc == 0
              - __nessus_scanner_readings__['names-localhost'].stdout is search('does match')
              - __nessus_scanner_readings__['names-host'].stdout is search('does match')
            fail_msg: >-
              The certificate bundle is not usable as declared. Decoded:
              {{ __nessus_scanner_decoded__.results | map(attribute='rc') | list }} (a non-zero
              here on a FIPS host means a legacy PKCS#12 -- re-mint with
              scripts/mint-nessus-https.sh); CA certificates in the bundle:
              {{ __nessus_scanner_ca_count__.stdout | default('?') }} (exactly 1 is required);
              chain: {{ __nessus_scanner_readings__['chain'].stdout | default('') }} {{ __nessus_scanner_readings__['chain'].stderr | default('') }};
              key matches certificate: {{ __nessus_scanner_readings__['certificate-public-key'].stdout == __nessus_scanner_readings__['key-public-key'].stdout }};
              in date for a day: {{ __nessus_scanner_readings__['in-date'].rc == 0 }};
              {{ __nessus_scanner_readings__['names-localhost'].stdout | default('') }};
              {{ __nessus_scanner_readings__['names-host'].stdout | default('') }}.
            quiet: true

        - name: 'PROCESS | Import The Certificate Into Nessus'
          changed_when: true
          notify: 'nessus-restart-required'
          register: '__nessus_scanner_imported__'
          when: >-
            __nessus_scanner_certificate__['served-fingerprint'].stdout
            != __nessus_scanner_certificate__['declared-fingerprint'].stdout
            or __nessus_scanner_certificate__['served-ca-fingerprint'].stdout
            != __nessus_scanner_certificate__['declared-ca-fingerprint'].stdout

          ansible.builtin.command:
            argv:
              - "{{ __nessus_scanner_cli__ }}"
              - 'import-certs'
              - "--serverkey={{ __nessus_scanner_pem__.key }}"
              - "--servercert={{ __nessus_scanner_pem__.certificate }}"
              - "--cacert={{ __nessus_scanner_pem__.ca }}"

        - name: 'VERIFY | Require Nessus To Accept The Certificate'
          when: __nessus_scanner_imported__ is not skipped
          ansible.builtin.assert:
            that: __nessus_scanner_imported__.stdout is search('Successfully imported')
            fail_msg: >-
              nessuscli import-certs did not report success: {{ __nessus_scanner_imported__.stdout }}
            quiet: true

      # The plaintext key lives only between decoding and import. The loader removes its whole
      # temporary directory at the end of the role too; this removes the key the moment it is done.
      always:
        - name: 'CLEANUP | Remove The Decoded Private Key'
          changed_when: false
          loop:
            - "{{ __nessus_scanner_pem__.key }}"
            - "{{ __nessus_scanner_pem__.key }}.bag"

          ansible.builtin.file:
            path: "{{ item }}"
            state: 'absent'

    #endregion --- [ Process: 06 Import The Declared HTTPS Certificate ] --------------------- #

    #region ------ [ Process: 07 The One Administrator Account ] ---------------------------- #
    # Created BEFORE registration, from the command line, which needs neither the service nor
    # the API. The web tier reads whether setup is complete when the service starts, so the start
    # that follows registration must find the account already there (measured 2026-09-30: an
    # account added after that start left /server/status at 'register' until the next restart).
    #
    # The product's command line is interactive: it reads each answer as a line on stdin. Every
    # write is judged by its words as well as its status: the words are the only statement of
    # which of its several refusals it made.

    - name: 'BEGIN | Read The Accounts Nessus Holds'
      changed_when: false
      register: '__nessus_scanner_accounts__'

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'lsuser' ]

    - name: 'BEGIN | Record The Accounts'
      ansible.builtin.set_fact:
        __nessus_scanner_account_names__: >-
          {{ __nessus_scanner_accounts__.stdout_lines | map('trim') | reject('equalto', '') | list }}
        cacheable: false

    - name: 'VERIFY | Refuse An Account The Playbook Did Not Declare'
      ansible.builtin.assert:
        that: >-
          __nessus_scanner_account_names__
          | reject('equalto', nessus_scanner_running.administrator.username) | list | length == 0
        fail_msg: >-
          Nessus holds {{ __nessus_scanner_account_names__ | join(', ') }}, but the playbook
          declares only '{{ nessus_scanner_running.administrator.username }}'. Professional and
          Essentials hold one account; remove the other with 'nessuscli rmuser' or declare it.
        quiet: true

    - name: 'PROCESS | Create The Administrator'
      changed_when: true
      no_log: true
      notify: 'nessus-restart-required'
      register: '__nessus_scanner_created__'
      when: nessus_scanner_running.administrator.username not in __nessus_scanner_account_names__

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'adduser', "{{ nessus_scanner_running.administrator.username }}" ]
        # One answer per line: the password, the password again, system administrator: yes, no
        # rules (the blank line), confirm. A literal block, because backslash escapes inside a
        # template are NOT unescaped by ansible-core 2.21 (measured 2026-09-30).
        stdin: |-
          {{ nessus_scanner_running.administrator.password | string | trim }}
          {{ nessus_scanner_running.administrator.password | string | trim }}
          y

          y
        stdin_add_newline: true

    - name: 'VERIFY | Require The Administrator To Be Created'
      when: __nessus_scanner_created__ is not skipped
      ansible.builtin.assert:
        that: __nessus_scanner_created__.stdout | default('') is search('User added')
        fail_msg: >-
          nessuscli adduser did not report 'User added' (rc={{ __nessus_scanner_created__.rc | default('?') }}).
        quiet: true

    #endregion --- [ Process: 07 The One Administrator Account ] ---------------------------- #

    # A settings change, a new certificate or a new account takes effect only when the service
    # restarts; the handler runs once however many of them changed, and never when none did.
    - name: 'PROCESS | Apply Pending Restarts Before Registration'
      ansible.builtin.meta: 'flush_handlers'

    #region ------ [ Process: 08 Register And Fetch The Plugins ] --------------------------- #
    # 'fetch --check' answers 0 only for a registered installation. Registration runs with the
    # service stopped, as the vendor documents, and downloads the full plugin set before it
    # returns -- minutes, bounded by the task timeout rather than async (see the header). The
    # code is an argument on the guest's command line for the life of that one command, the only
    # interface the product offers; it is never logged.

    - name: 'BEGIN | Read Whether The Scanner Is Registered'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_registration__'

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'fetch', '--check' ]

    # The plugin set is several gigabytes once unpacked, on the filesystem that holds the install
    # root. Measured before the download, so a disk too small fails here, by name, instead of
    # half-way through a registration that then has to be diagnosed from a truncated archive.
    - name: 'BEGIN | Read The Space Free Under The Install Root'
      changed_when: false
      register: '__nessus_scanner_free__'
      when: __nessus_scanner_registration__.rc != 0

      ansible.builtin.command:
        argv: [ 'df', '-P', '-k', "{{ nessus_scanner_running.install_root }}" ]

    - name: 'VERIFY | Require Room For The Plugin Set'
      when: __nessus_scanner_registration__.rc != 0
      vars:
        __nessus_scanner_free_kib__: "{{ (__nessus_scanner_free__.stdout_lines[-1].split())[3] | int }}"
      ansible.builtin.assert:
        that: (__nessus_scanner_free_kib__ | int) >= (nessus_scanner_running.minimum_free_gib | int) * 1048576
        fail_msg: >-
          {{ nessus_scanner_running.install_root }} has {{ ((__nessus_scanner_free_kib__ | int) / 1048576) | round(1) }}
          GiB free; registration needs at least {{ nessus_scanner_running.minimum_free_gib }} GiB for
          the plugin set. Grow the root volume (terraform/aws.tfvars root_block_device) or give the
          install root a volume of its own.
        quiet: true

    - name: 'PROCESS | Register The Scanner'
      when: __nessus_scanner_registration__.rc != 0
      block:
        - name: 'PROCESS | Stop The Service For Registration'
          ansible.builtin.systemd_service:
            name: "{{ nessus_scanner_running.service_name }}"
            state: 'stopped'

        - name: 'PROCESS | Register With The Activation Code And Fetch The Plugins'
          changed_when: true
          failed_when: false
          no_log: true
          register: '__nessus_scanner_registered__'
          timeout: "{{ nessus_scanner_running.timeouts.registration_seconds | int }}"

          ansible.builtin.command:
            argv:
              - "{{ __nessus_scanner_cli__ }}"
              - 'fetch'
              - '--register'
              - "{{ nessus_scanner_running.activation_code | string | trim }}"

        - name: 'VERIFY | Require The Registration To Succeed'
          ansible.builtin.assert:
            that: __nessus_scanner_registered__.rc | default(1) == 0
            fail_msg: >-
              nessuscli fetch --register failed (rc={{ __nessus_scanner_registered__.rc | default('?') }}):
              {{ (__nessus_scanner_registered__.stdout_lines | default([]))[-3:] | join(' / ') }}.
              A 400 means Tenable refused the activation code: check that it is current and not
              already in use by another scanner.
            quiet: true

      always:
        - name: 'PROCESS | Start The Service After Registration'
          ansible.builtin.systemd_service:
            name: "{{ nessus_scanner_running.service_name }}"
            state: 'started'

    #endregion --- [ Process: 08 Register And Fetch The Plugins ] --------------------------- #

    #region ------ [ Process: 09 Wait Until Ready, Over Validated HTTPS ] ------------------- #
    # This wait is also the HTTPS proof. It trusts ONLY the CA decoded from the declared bundle,
    # validates the chain and the hostname, and connects by the name 'localhost' the certificate
    # must carry -- so it cannot pass against a self-generated certificate, a different CA, or a
    # name mismatch. /server/status answers 503 while plugins compile and 200 once ready; a
    # refused connection while the service starts is just another attempt.

    # It first waits for Nessus to SETTLE: 'ready', or 'register' with its engine and feed both
    # ready -- the state it reports when nothing more is coming. A registered scanner that settles
    # on 'register' is holding a stale setup state; it is restarted once, and then only 'ready'
    # passes (measured 2026-09-30 on 10.12.4: licence, plugins and engine all ready, status
    # 'register' for 55 minutes; one restart, 'ready' 95 seconds later).

    - name: 'BEGIN | Wait Until Nessus Settles'
      changed_when: false
      delay: "{{ nessus_scanner_running.timeouts.ready_pause_seconds | int }}"
      failed_when: false
      register: '__nessus_scanner_status__'
      retries: "{{ nessus_scanner_running.timeouts.ready_attempts | int }}"
      until: >-
        (__nessus_scanner_status__.json | default({})).status | default('') == 'ready'
        or ((__nessus_scanner_status__.json | default({})).status | default('') == 'register'
            and (((__nessus_scanner_status__.json | default({})).detailed_status | default({})).engine_status
                 | default({})).status | default('') == 'ready'
            and (((__nessus_scanner_status__.json | default({})).detailed_status | default({})).feed_status
                 | default({})).status | default('') == 'ready')

      ansible.builtin.uri:
        ca_path: "{{ __nessus_scanner_pem__.ca }}"
        return_content: true
        status_code: [ 200, 503 ]
        timeout: 30
        url: "{{ __nessus_scanner_base_url__ }}/server/status"
        validate_certs: true

    - name: 'BEGIN | Read Whether The Settled Scanner Is Registered'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_settled_registration__'
      when: (__nessus_scanner_status__.json | default({})).status | default('') == 'register'

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'fetch', '--check' ]

    - name: 'PROCESS | Restart Once To Clear A Stale Setup State'
      register: '__nessus_scanner_unstuck__'
      when:
        - (__nessus_scanner_status__.json | default({})).status | default('') == 'register'
        - __nessus_scanner_settled_registration__.rc | default(1) == 0

      ansible.builtin.systemd_service:
        name: "{{ nessus_scanner_running.service_name }}"
        state: 'restarted'

    - name: 'BEGIN | Wait Until Nessus Reports Ready After The Restart'
      changed_when: false
      delay: "{{ nessus_scanner_running.timeouts.ready_pause_seconds | int }}"
      failed_when: false
      register: '__nessus_scanner_status_after__'
      retries: "{{ nessus_scanner_running.timeouts.ready_attempts | int }}"
      until: (__nessus_scanner_status_after__.json | default({})).status | default('') == 'ready'
      when: __nessus_scanner_unstuck__ is not skipped

      ansible.builtin.uri:
        ca_path: "{{ __nessus_scanner_pem__.ca }}"
        return_content: true
        status_code: [ 200, 503 ]
        timeout: 30
        url: "{{ __nessus_scanner_base_url__ }}/server/status"
        validate_certs: true

    - name: 'BEGIN | Record The Final Status'
      ansible.builtin.set_fact:
        __nessus_scanner_status_final__: >-
          {{ __nessus_scanner_status_after__
             if (__nessus_scanner_status_after__ is not skipped) else __nessus_scanner_status__ }}
        cacheable: false

    - name: 'VERIFY | Require Nessus Ready Over Validated HTTPS'
      ansible.builtin.assert:
        that:
          - __nessus_scanner_status_final__.status | default(0) == 200
          - (__nessus_scanner_status_final__.json | default({})).status | default('') == 'ready'
        fail_msg: >-
          Nessus did not report ready over HTTPS validated against the declared CA. Last answer:
          {{ __nessus_scanner_status_final__.msg | default('') }}
          {{ (__nessus_scanner_status_final__.json | default({})) | to_json }}
        quiet: true

    #endregion --- [ Process: 09 Wait Until Ready, Over Validated HTTPS ] ------------------- #

    #region ------ [ Process: 10 Prove The Account Over Validated HTTPS ] ------------------- #
    # The account exists (region 07); signing in proves the declared password opens it, over the
    # same CA- and hostname-validated HTTPS. A refused sign-in means the declared password moved,
    # and the account is converged to it.

    - name: 'BEGIN | Sign In As The Administrator'
      changed_when: false
      no_log: true
      register: '__nessus_scanner_signin__'

      ansible.builtin.uri:
        body:
          username: "{{ nessus_scanner_running.administrator.username }}"
          password: "{{ nessus_scanner_running.administrator.password | string | trim }}"
        body_format: 'json'
        ca_path: "{{ __nessus_scanner_pem__.ca }}"
        method: 'POST'
        return_content: true
        status_code: [ 200, 401 ]
        timeout: 30
        url: "{{ __nessus_scanner_base_url__ }}/session"
        validate_certs: true

    - name: 'PROCESS | Reset The Administrator Password'
      changed_when: true
      no_log: true
      register: '__nessus_scanner_reset__'
      when: __nessus_scanner_signin__.status | default(0) == 401

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'chpasswd', "{{ nessus_scanner_running.administrator.username }}" ]
        # The new password and its confirmation, one per line (see the account creation above).
        stdin: |-
          {{ nessus_scanner_running.administrator.password | string | trim }}
          {{ nessus_scanner_running.administrator.password | string | trim }}
        stdin_add_newline: true

    - name: 'VERIFY | Require The Password Reset'
      when: __nessus_scanner_reset__ is not skipped
      ansible.builtin.assert:
        that: __nessus_scanner_reset__.stdout | default('') is search('Password changed')
        fail_msg: >-
          nessuscli chpasswd did not report 'Password changed' (rc={{ __nessus_scanner_reset__.rc | default('?') }}).
        quiet: true

    - name: 'BEGIN | Sign In Again After The Reset'
      changed_when: false
      no_log: true
      register: '__nessus_scanner_signin_again__'
      when: __nessus_scanner_reset__ is not skipped

      ansible.builtin.uri:
        body:
          username: "{{ nessus_scanner_running.administrator.username }}"
          password: "{{ nessus_scanner_running.administrator.password | string | trim }}"
        body_format: 'json'
        ca_path: "{{ __nessus_scanner_pem__.ca }}"
        method: 'POST'
        return_content: true
        status_code: [ 200, 401 ]
        timeout: 30
        url: "{{ __nessus_scanner_base_url__ }}/session"
        validate_certs: true

    - name: 'BEGIN | Record The Effective Sign-In'
      no_log: true
      ansible.builtin.set_fact:
        __nessus_scanner_session__: >-
          {{ __nessus_scanner_signin_again__
             if (__nessus_scanner_signin_again__ is not skipped) else __nessus_scanner_signin__ }}
        cacheable: false

    - name: 'VERIFY | Require The Administrator To Sign In Over Validated HTTPS'
      ansible.builtin.assert:
        that:
          - __nessus_scanner_session__.status | default(0) == 200
          - (__nessus_scanner_session__.json | default({})).token | default('') | length > 0
        fail_msg: >-
          '{{ nessus_scanner_running.administrator.username }}' could not sign in to the API
          (HTTP {{ __nessus_scanner_session__.status | default('?') }}) with the declared password.
        quiet: true

    - name: 'CLEANUP | Sign Out'
      changed_when: false
      failed_when: false
      no_log: true

      ansible.builtin.uri:
        ca_path: "{{ __nessus_scanner_pem__.ca }}"
        headers:
          X-Cookie: "token={{ (__nessus_scanner_session__.json | default({})).token | default('') }}"
        method: 'DELETE'
        status_code: [ 200 ]
        timeout: 30
        url: "{{ __nessus_scanner_base_url__ }}/session"
        validate_certs: true

    #endregion --- [ Process: 10 Prove The Account Over Validated HTTPS ] ------------------- #

    #region ------ [ Verify: 11 The Whole Result, Read Back From The Machine ] --------------- #

    - name: 'VERIFY | Read The Installed Version'
      changed_when: false
      register: '__nessus_scanner_rpm_version__'

      ansible.builtin.command:
        argv: [ 'rpm', '-q', '--queryformat', '%{VERSION}', "{{ nessus_scanner_running.package_name }}" ]

    - name: 'VERIFY | Read The Service State'
      changed_when: false
      failed_when: false
      loop: [ 'is-enabled', 'is-active' ]
      register: '__nessus_scanner_unit__'

      ansible.builtin.command:
        argv: [ 'systemctl', "{{ item }}", "{{ nessus_scanner_running.service_name }}" ]

    - name: 'VERIFY | Read The Registration Again'
      changed_when: false
      failed_when: false
      register: '__nessus_scanner_registration_after__'

      ansible.builtin.command:
        argv: [ "{{ __nessus_scanner_cli__ }}", 'fetch', '--check' ]

    # What the listener actually SERVES, not what a file says it should: the handshake's leaf
    # certificate, fingerprinted.
    - name: 'VERIFY | Read The Certificate The Listener Serves'
      changed_when: false
      register: '__nessus_scanner_served__'

      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          {{ __nessus_scanner_openssl__ }} s_client -connect 127.0.0.1:{{ __nessus_scanner_port__ }}
          -servername localhost </dev/null 2>/dev/null
          | {{ __nessus_scanner_openssl__ }} x509 -noout -fingerprint -sha256
        executable: '/bin/bash'

    - name: 'VERIFY | Require The Declared Scanner'
      ansible.builtin.assert:
        that:
          - __nessus_scanner_rpm_version__.stdout == nessus_scanner_running.installer.version
          - __nessus_scanner_unit__.results[0].stdout | trim == 'enabled'
          - __nessus_scanner_unit__.results[1].stdout | trim == 'active'
          - __nessus_scanner_registration_after__.rc == 0
          - __nessus_scanner_served__.stdout | trim == __nessus_scanner_certificate__['declared-fingerprint'].stdout | trim
        fail_msg: >-
          The scanner is not in the declared state. Installed version:
          {{ __nessus_scanner_rpm_version__.stdout }} (declared {{ nessus_scanner_running.installer.version }});
          service: {{ __nessus_scanner_unit__.results | map(attribute='stdout') | join('/') }};
          registered: {{ __nessus_scanner_registration_after__.rc == 0 }};
          served certificate: {{ __nessus_scanner_served__.stdout | trim }} (declared
          {{ __nessus_scanner_certificate__['declared-fingerprint'].stdout | trim }}).
        quiet: true

    #endregion --- [ Verify: 11 The Whole Result, Read Back From The Machine ] --------------- #

  always:
    - name: 'CLEANUP | Remove The Controller Staging Directory'
      become: false
      changed_when: false
      delegate_to: 'localhost'
      when: __nessus_scanner_stage__.path is defined
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

      ansible.builtin.file:
        path: "{{ __nessus_scanner_stage__.path }}"
        state: 'absent'
