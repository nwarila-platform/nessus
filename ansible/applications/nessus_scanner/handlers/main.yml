# =========================================================================================== #
# File: '{{ role_path }}/handlers/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# The scanner reads its settings and its certificate once, at start, and its web tier reads
# whether setup is complete only then (measured 2026-09-30). Tasks in present_redhat.yml change
# all three -- settings, certificate, the account -- and none takes effect until the service
# restarts, so each notifies this handler rather than a result a growing condition must test.
#
# present_redhat.yml flushes it before registration, so the readiness wait that follows judges
# the restarted service.
#
# =========================================================================================== #
---
- name: 'Restart the Nessus scanner service'
  listen: 'nessus-restart-required'

  ansible.builtin.systemd_service:
    daemon_reexec: false
    daemon_reload: false
    name: "{{ nessus_scanner_running.service_name }}"
    no_block: false
    scope: 'system'
    state: 'restarted'
