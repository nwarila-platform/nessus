# =========================================================================================== #
# File: 'ansible/playbooks/nessus-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Brings the ephemeral EC2 instance from "the API says it exists" to a registered Nessus scanner
# serving HTTPS on a STIG-hardened RHEL 8 host.
#
# The inventory decides how the host is reached; this play's ordered credential sets decide who
# logs on. A new image answers only as its image account, with the launch key.
#
# Runs from the composed tree: the workflow overlays this repository onto the pinned framework
# and uses its configuration, role search path, connection defaults, and explicit fact gathering.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory already filters to this run's instance by its framework-set tags. This guards the
# two states that filter cannot cover: an empty result, where nothing launched or nothing tagged,
# and an invocation that never said which account it is deploying into.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require At Least One Filtered Host'
      ansible.builtin.assert:
        that: groups['nessus_servers'] | default([]) | length >= 1
        fail_msg: >-
          Refusing to configure: the 'nessus_servers' inventory group is empty. The dynamic EC2
          inventory found no running instance tagged for this run -- a zero-host inventory is not a
          successful deployment proof.
        quiet: true

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'INVENTORY | Require The AWS Deployment Identity'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Prepare The Hosts ] ---------------------------------------------------- #

- name: 'PLAY | Prepare The Hosts (ephemeral AWS)'
  hosts: 'nessus_servers'
  any_errors_fatal: true
  vars:
    # The CIS RHEL 8 STIG image answers only as its image account, authenticated by the account
    # key pair it installed from instance metadata at first boot. Nothing here joins a directory,
    # so there is no later identity to hand over to.
    credential_sets:
      - name: 'image-administrator'
        connection: 'ssh'
        user: 'ec2-user'
        private_key_file: "{{ lookup('ansible.builtin.env', 'CI_PRIVATE_KEY') \
          | default('~/.ssh/nwarila-ec2-key', true) | expanduser }}"

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:
    # The image account must reach uid 0 by non-interactive sudo: every later play escalates.
    - role: 'credential_resolver'
      tags: ['always']
      vars:
        credential_resolver_candidates: "{{ credential_sets }}"
        credential_resolver_require_elevated: true
        credential_resolver_wait_pause_seconds: 10
        credential_resolver_wait_rounds: 60

    - role: 'host_readiness'

    # RHEL 8 ships Python 3.6, below ansible-core's floor; the bootstrap installs the Python 3.12
    # the inventory names for every later module, over raw, before any module runs.
    - role: 'os_bootstrap'

    # The scanner's whole install root lives on its own standalone EBS volume -- binaries,
    # plugins, settings, certificates, users and scan data -- so the OS disk can be replaced
    # (refresh_serial) while the volume detaches and re-attaches to the replacement. Tenable's
    # supported way to move a scanner's data is to move /opt/nessus as a whole, so that is the
    # unit. The Function tag is the identity the volume is resolved by, never a device name; an
    # already-labelled volume is adopted without reformatting. Removing the scanner does not
    # justify touching the disk that holds it.
    - role: 'linux_disk_manager'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        # The resolver filters volumes by this host's instance id. The inventory publishes it as
        # aws_instance_id (hostvars_prefix), and ansible_host is an address, not an id.
        instance_id: "{{ aws_instance_id }}"
        linux_disk_manager:
          platform: 'aws'
          disks:
            - function: 'NESSUS'
              mount_point: '/opt/nessus'
              label: 'NESSUS'
              fstype: 'xfs'
              opts: 'defaults,nodev,nosuid'
              # The vendor's package declares /opt/nessus drwxrwxr-x and sets it on install; a
              # different mode here would flip it back on every converge (measured 2026-09-30).
              mode: '0775'

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Prepare The Hosts ] ---------------------------------------------------- #

#region ------ [ Play: Nessus Scanner ] ------------------------------------------------------- #
# The product is the slow half of a converge -- registration downloads the whole plugin set and
# the first start compiles it -- and the only half a host does not need to exist. Tagged so a run
# can build the host alone when what is under test is the ground the scanner stands on.

- name: 'PLAY | Nessus Scanner (ephemeral AWS)'
  hosts: 'nessus_servers'
  any_errors_fatal: true
  become: true
  tags: ['products']
  vars:
    # Where every Nessus deployment object lives: the runner reads exactly these three objects,
    # and nothing else under the prefix (dependencies/aws/policies/…_runner_s3.json).
    nessus_objects_bucket: "{{ aws_account_id }}-ansible"
    nessus_objects_prefix: 'applications/nessus'
    nessus_secret_prefix: "s3://{{ nessus_objects_bucket }}/{{ nessus_objects_prefix }}"
    # The scanner's web listener: one value, so the host firewall below and the role agree on it.
    nessus_listener_port: 8834

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:
    - role: 'nessus_scanner'
      vars:
        nessus_scanner:

          listener:
            port: "{{ nessus_listener_port }}"

          # The digest is Tenable's published SHA-256 for this build; the application repository
          # carries the object at the layout the role composes from the version. A version bump
          # is these two values and dependencies/aws/artifacts.yml.
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '10.12.4'
            sha256: 'df378dd85dea63c0bd1e07d35262e967dca1a0286d84e783edcf956fa85a5444'

          # Supplied at dispatch (aws-deploy.yml's activation_code), never stored; never logged.
          activation_code: "{{ lookup('ansible.builtin.env', 'NESSUS_ACTIVATION_CODE') }}"

          # The one Nessus account, and the password that opens it.
          administrator:
            username: 'nessusadmin'
            password: "{{ lookup('secret', nessus_secret_prefix ~ '/administrator-password.txt') }}"

          # The HTTPS bundle minted by scripts/mint-nessus-https.sh: a private root CA and the
          # server certificate it signed, names tcnaw-nessus01, localhost and 127.0.0.1. A
          # re-mint changes this digest in the same commit that uploads the new bundle.
          certificate:
            bucket: "{{ nessus_objects_bucket }}"
            key: "{{ nessus_objects_prefix }}/nessus-https.p12"
            sha256: 'f1a31cd9bb7db4c9c82c475059fb0625bf85ab7f305de14250d7d6a544924044'
            password: "{{ lookup('secret', nessus_secret_prefix ~ '/nessus-https-p12-password.txt') }}"

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:
    # The host firewall is nftables itself, not firewalld (decision 2026-10-01, TD-009):
    # firewalld is masked, and this ruleset is the host's whole filter. The role knows nothing of
    # firewalls, so it works the same behind any, and these run after it: under state=absent the
    # listener is closed once the scanner is gone.
    - name: 'PROCESS | Install nftables'
      ansible.builtin.dnf:
        allow_downgrade: false
        allowerasing: false
        autoremove: false
        bugfix: false
        cacheonly: false
        disable_gpg_check: false
        disable_plugin: []
        disablerepo: []
        download_only: false
        enable_plugin: []
        enablerepo: []
        exclude: []
        install_weak_deps: true
        installroot: '/'
        lock_timeout: 30
        name: 'nftables'
        security: false
        skip_broken: false
        sslverify: true
        state: 'present'
        update_cache: false
        update_only: false
        use_backend: 'auto'
        validate_certs: true

    # credential_resolver owns the SSH port: the winning set supplies it, or it publishes null and
    # ssh's own default, 22, applies -- so the rule reads that default where it is null.
    - name: 'PROCESS | Write The Host nftables Ruleset'
      register: '__nessus_nftables_ruleset__'
      ansible.builtin.copy:
        backup: false
        content: |
          #!/usr/sbin/nft -f
          # Managed by ansible/playbooks/nessus-aws.yml; a local edit is overwritten.
          flush ruleset

          table inet filter {
              chain input {
                  type filter hook input priority 0; policy drop;
                  ct state established,related accept
                  ct state invalid drop
                  iif "lo" accept
                  ip saddr 127.0.0.0/8 drop
                  ip6 saddr ::1 drop
                  meta l4proto { icmp, ipv6-icmp } accept
                  tcp dport {{ ansible_port | default(22, true) }} ct state new limit rate 25/second burst 50 packets accept
          {% if (state | default('present') | string | lower | trim) != 'absent' %}
                  tcp dport {{ nessus_listener_port }} ct state new limit rate 25/second burst 50 packets accept
          {% endif %}
              }
              chain forward {
                  type filter hook forward priority 0; policy drop;
              }
              chain output {
                  type filter hook output priority 0; policy accept;
              }
          }
        decrypt: true
        dest: '/etc/sysconfig/nftables.conf'
        follow: false
        force: true
        group: 'root'
        local_follow: true
        mode: '0600'
        owner: 'root'
        remote_src: false
        unsafe_writes: false
        validate: '/usr/sbin/nft -c -f %s'

    # Stopping firewalld removes its own rules, so until nftables loads a moment later the host
    # filters nothing -- which cannot drop the session running this. Masked, so nothing starts it
    # again behind this ruleset.
    - name: 'PROCESS | Stop And Mask firewalld'
      ansible.builtin.systemd_service:
        daemon_reexec: false
        daemon_reload: false
        masked: true
        name: 'firewalld'
        no_block: false
        scope: 'system'
        state: 'stopped'

    - name: 'PROCESS | Enable And Start nftables'
      register: '__nessus_nftables_service__'
      ansible.builtin.systemd_service:
        daemon_reexec: false
        daemon_reload: false
        enabled: true
        name: 'nftables'
        no_block: false
        scope: 'system'
        state: 'started'

    - name: 'PROCESS | Load A Changed Ruleset'
      when:
        - __nessus_nftables_ruleset__ is changed
        - __nessus_nftables_service__ is not changed
      ansible.builtin.systemd_service:
        daemon_reexec: false
        daemon_reload: false
        name: 'nftables'
        no_block: false
        scope: 'system'
        state: 'reloaded'

  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

#endregion --- [ Play: Nessus Scanner ] ------------------------------------------------------- #

#region ------ [ Play: Data Volume Proof (opt-in) ] ------------------------------------------- #
# Proves the scanner resumes on its OWN DATA after the OS disk is replaced: 'mark' writes a
# record into Nessus's database (a scan folder) before the replacement, 'verify' reads it back
# after. The record exists only in the database on the data volume, so reading it back proves
# the volume moved AND that Nessus opened its existing database rather than a new one.
#
# Tagged 'never', so an ordinary converge never runs it; the workflow asks for it by tag, with
# nessus_data_proof set to 'mark' or 'verify' and nessus_data_proof_marker naming the record.

- name: 'PLAY | Prove The Scanner Resumes On Its Data Volume (opt-in)'
  hosts: 'nessus_servers'
  any_errors_fatal: true
  become: true
  tags: ['never', 'nessus_data_proof']
  vars:
    __proof_url__: 'https://localhost:8834'
    # The listener's CA, which the role converges to the declared CA.
    __proof_ca__: '/opt/nessus/com/nessus/CA/cacert.pem'
    __proof_folder__: "os-swap-proof-{{ nessus_data_proof_marker }}"

  tasks:
    - name: 'PROCESS | Require A Proof Action And Marker'
      ansible.builtin.assert:
        that:
          - nessus_data_proof | default('') in ['mark', 'verify']
          - nessus_data_proof_marker | default('') is match('^[A-Za-z0-9-]{1,40}$')
        fail_msg: >-
          Pass nessus_data_proof=mark|verify and nessus_data_proof_marker (letters, digits and
          dashes) as extra-vars.
        quiet: true

    # Signed out in 'always', so a failed write or read still ends the session it opened; a
    # refused sign-in opened none.
    - name: 'PROCESS | Mark Or Verify The Proof Record'
      block:
        - name: 'PROCESS | Sign In As The Administrator'
          changed_when: false
          failed_when: false
          no_log: true
          register: '__proof_session__'
          ansible.builtin.uri:
            body:
              username: 'nessusadmin'
              password: >-
                {{ lookup('secret', 's3://' ~ aws_account_id
                   ~ '-ansible/applications/nessus/administrator-password.txt') | trim }}
            body_format: 'json'
            ca_path: "{{ __proof_ca__ }}"
            decompress: true
            follow_redirects: 'safe'
            force: false
            force_basic_auth: false
            headers: {}
            http_agent: 'ansible-httpget'
            method: 'POST'
            remote_src: false
            return_content: false
            status_code: [ 200 ]
            timeout: 30
            unredirected_headers: []
            unsafe_writes: false
            url: "{{ __proof_url__ }}/session"
            use_gssapi: false
            use_netrc: false
            use_proxy: true
            validate_certs: true

        # The sign-in carries no_log, which hides its response and the product's own error, so it
        # never fails; this names any answer that is not a session.
        - name: 'PROCESS | Require The Administrator To Sign In'
          ansible.builtin.assert:
            that: __proof_session__.status | default(-1) == 200
            fail_msg: >-
              The administrator could not sign in to prove the data volume: HTTP
              {{ __proof_session__.status | default(-1) }}
              {{ __proof_session__.json.error | default('') }}
              {{ __proof_session__.msg
                 | default('uri returned no status: the request did not complete') }}.
            quiet: true

        - name: 'PROCESS | Write The Proof Record Before The OS Is Replaced'
          changed_when: true
          no_log: true
          when: nessus_data_proof == 'mark'
          ansible.builtin.uri:
            body:
              name: "{{ __proof_folder__ }}"
            body_format: 'json'
            ca_path: "{{ __proof_ca__ }}"
            decompress: true
            follow_redirects: 'safe'
            force: false
            force_basic_auth: false
            headers:
              X-Cookie: "token={{ __proof_session__.json.token }}"
            http_agent: 'ansible-httpget'
            method: 'POST'
            remote_src: false
            return_content: false
            status_code: [ 200 ]
            timeout: 30
            unredirected_headers: []
            unsafe_writes: false
            url: "{{ __proof_url__ }}/folders"
            use_gssapi: false
            use_netrc: false
            use_proxy: true
            validate_certs: true

        - name: 'PROCESS | Read The Records Nessus Holds'
          changed_when: false
          no_log: true
          register: '__proof_folders__'
          ansible.builtin.uri:
            body_format: 'raw'
            ca_path: "{{ __proof_ca__ }}"
            decompress: true
            follow_redirects: 'safe'
            force: false
            force_basic_auth: false
            headers:
              X-Cookie: "token={{ __proof_session__.json.token }}"
            http_agent: 'ansible-httpget'
            method: 'GET'
            remote_src: false
            return_content: false
            status_code: [ 200 ]
            timeout: 30
            unredirected_headers: []
            unsafe_writes: false
            url: "{{ __proof_url__ }}/folders"
            use_gssapi: false
            use_netrc: false
            use_proxy: true
            validate_certs: true

        - name: 'PROCESS | Require The Proof Record In The Scanner Database'
          ansible.builtin.assert:
            that: >-
              __proof_folder__ in (__proof_folders__.json.folders | map(attribute='name') | list)
            fail_msg: >-
              Nessus's database does not hold '{{ __proof_folder__ }}'
              ({{ nessus_data_proof }}): it holds
              {{ __proof_folders__.json.folders | map(attribute='name') | list }}.
            quiet: true

      always:
        - name: 'PROCESS | Sign Out'
          changed_when: false
          failed_when: false
          no_log: true
          when: __proof_session__.json.token is defined
          ansible.builtin.uri:
            body_format: 'raw'
            ca_path: "{{ __proof_ca__ }}"
            decompress: true
            follow_redirects: 'safe'
            force: false
            force_basic_auth: false
            headers:
              X-Cookie: "token={{ __proof_session__.json.token }}"
            http_agent: 'ansible-httpget'
            method: 'DELETE'
            remote_src: false
            return_content: false
            status_code: [ 200 ]
            timeout: 30
            unredirected_headers: []
            unsafe_writes: false
            url: "{{ __proof_url__ }}/session"
            use_gssapi: false
            use_netrc: false
            use_proxy: true
            validate_certs: true

#endregion --- [ Play: Data Volume Proof (opt-in) ] ------------------------------------------- #
