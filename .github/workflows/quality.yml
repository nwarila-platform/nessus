# =========================================================================================== #
# Repository-local Ansible, shell and dependency-declaration quality gate.
# Fleet-uniform port of the golden pdq-deploy-inventory workflow: role names are DISCOVERED
# from ansible/applications/ instead of hard-coded, so adding a role needs no edit here.
# =========================================================================================== #
---
name: Quality

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install quality tools
        run: |
          set -euo pipefail
          pip install -r requirements-quality.txt
          # ansible-lint resolves modules offline, so the collections the roles call must be
          # present before the syntax check runs.
          ansible-galaxy collection install --force \
            --requirements-file requirements-quality.yml

      # Credential-free: the IAM, artifact and secret declarations under dependencies/ must be
      # internally closed, tokenized, canonical, and agree with what the playbook consumes.
      - name: Check dependency declarations
        run: python3 scripts/check-dependencies.py

      - name: Lint YAML
        run: yamllint -c .yamllint.yml ansible

      - name: Read framework pin
        id: pins
        run: |
          set -euo pipefail
          mapfile -t lines < .github/ansible-framework-pin
          if [ "${#lines[@]}" -ne 1 ]; then
            echo '.github/ansible-framework-pin must contain exactly one line' >&2
            exit 1
          fi
          pin="${lines[0]}"
          if [[ ! "${pin}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '.github/ansible-framework-pin must be one lowercase 40-character Git SHA' >&2
            exit 1
          fi
          printf 'ansible=%s\n' "${pin}" >> "${GITHUB_OUTPUT}"

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: nwarila-platform/ansible-framework
          ref: ${{ steps.pins.outputs.ansible }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Compose application roles
        run: |
          set -euo pipefail
          scripts/materialize-role-scripts.sh
          # The framework's roles carry stubs of their own; materialize them in the checkout
          # before the overlay, for the same reason the deploy workflow does.
          if [ -x .frameworks/ansible-framework/scripts/materialize-role-scripts.sh ]; then
            (cd .frameworks/ansible-framework && ./scripts/materialize-role-scripts.sh)
          fi
          for role_source in ansible/applications/*/; do
            role_name="$(basename "${role_source}")"
            rsync -a --delete "${role_source}" \
              ".frameworks/ansible-framework/applications/${role_name}/"
          done

      - name: Lint Ansible
        working-directory: .frameworks/ansible-framework
        run: |
          set -euo pipefail
          roles=()
          for role_source in "${GITHUB_WORKSPACE}"/ansible/applications/*/; do
            roles+=("applications/$(basename "${role_source}")")
          done
          ansible-lint "${roles[@]}"

      # The playbook composes framework roles by bare name, so its syntax is only checkable from
      # inside the composed tree, where roles_path resolves them.
      - name: Check playbook syntax
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
        run: |
          set -euo pipefail
          for playbook in "${GITHUB_WORKSPACE}"/ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check --inventory localhost, "${playbook}"
          done

      - name: Check shell syntax
        run: bash -n scripts/*.sh
