# =========================================================================================== #
# AWS Deploy — nessus
# ------------------------------------------------------------------------------------------- #
# Ephemeral lifecycle: terraform init/apply -> ansible -> terraform destroy on the normal path.
# Terraform is DATA-ONLY here (a plain tfvars, no .tf files); resources live in the pinned
# aws-terraform-framework, configuration in the pinned ansible-framework + this repo's role.
#
#   * AWS credentials are issued only to this workflow at refs/heads/main. Pull requests use
#     the credential-free quality workflow; feature-branch workflow code never reaches AWS.
#   * The host is the CIS RHEL 8 STIG image. The play resolves its image account, bootstraps
#     Python, then installs, registers and certifies Nessus, and proves HTTPS against the declared
#     CA and hostname on the host itself.
#   * Reachability: direct SSH to a subnet-assigned public IPv4. The framework adds one
#     run-scoped security group, sourced from the runner's validated public IPv4 and, when an
#     operator hostname is configured, from the address it resolves to -- so a person can SSH to a
#     held scanner and tunnel its HTTPS listener. This configuration creates no EIP and has no
#     NAT. credential_resolver performs the bounded-round connection wait because readiness_gate
#     remains disabled.
#   * AWS credentials are exchanged before provisioning, refreshed before the idempotency proof
#     (a first converge registers and compiles the full plugin set, the long pole of the run), and
#     refreshed again before eligible teardown so long holds do not reach destroy with expired
#     credentials. The 330-minute job budget stays below the runner's 360-minute execution limit.
#     It is not a teardown guarantee: abnormal delay can exhaust the budget before destroy and
#     strand paid resources, which aws-reaper.yml exists to clean up.
#   * The scanner's whole install root is a standalone data volume, so the OS disk is
#     replaceable: os_swap bumps refresh_serial, re-converges onto the re-attached volume, and
#     proves Nessus reads back a record written into its database before the replacement.
#   * One fixed state key; this workflow's concurrency group prevents overlapping applies and
#     never cancels a live lifecycle. A later lifecycle can clean predecessor state before apply,
#     and aws-reaper.yml destroys what a run killed before destroy leaves behind.
#   * DISPATCH ONLY, on protected main. Every run registers a new scanner, and a Nessus
#     Essentials code registers one scanner once (TD-007), so the operator supplies a fresh code
#     at dispatch; a push or a schedule has none to give and could only fail. The code is masked
#     before any step can print it and is given only to the converges that may register. One
#     durable incident is updated on failure and closed after the next success.
# =========================================================================================== #
name: AWS Deploy

'on':
  workflow_dispatch:
    inputs:
      activation_code:
        description: A fresh Nessus activation code, masked in the logs and never stored. Enter it here, not with gh -f (shell history); a re-run reuses a spent one.
        type: string
        required: true
      hold_minutes:
        description: Hold the converged guest before teardown
        type: choice
        options: [ '0', '15', '60', '120', '240' ]
        default: '0'
      os_swap:
        description: After converge, replace the OS drive and prove the scanner resumes on its data volume
        type: boolean
        default: false
      absent_proof:
        description: After converge, prove state=absent removes the scanner idempotently
        type: boolean
        default: false
      skip_products:
        description: Build the host only - skip Nessus and its idempotency gate
        type: boolean
        default: false
permissions: {}

# One boundary, one state key — never two runs at once, never cancel a live apply.
concurrency:
  group: aws-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  main-ref:
    name: Protected main ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse privileged execution outside protected main
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "${EXPECTED_REF}" ]; then
            echo "::error::AWS lifecycle runs only from ${EXPECTED_REF}; got ${GITHUB_REF}."
            exit 1
          fi

  aws-deploy:
    name: AWS (ephemeral deploy-test-destroy)
    needs: main-ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The 330-minute budget leaves margin around a 240-minute hold and remains below the runner's
    # 360-minute execution limit; a timeout can still strand resources before teardown.
    timeout-minutes: 330
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE: nwarila-platform_nessus_runner
      # Must match key_name in terraform/aws.tfvars.
      CI_KEY_NAME: nwarila-ec2-key

    steps:
      # Read from the event file, so the code is masked before any step's env can carry it;
      # masking the input expression itself would print it once in that step's own header. The
      # shape check is validate.yml's own rule, repeated so a typo fails before Terraform rather
      # than after an apply; validate.yml stays the owner of the contract.
      - name: Mask and check the activation code
        run: |
          set -euo pipefail
          # Trimmed at the ends only, as validate.yml trims: inner whitespace must fail the check,
          # because a mask of the squeezed value would not cover the value the converges are given.
          code="$(jq -r '.inputs.activation_code // ""' "${GITHUB_EVENT_PATH}" \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [[ ! "${code}" =~ ^[A-Za-z0-9-]{16,64}$ ]]; then
            echo "::error::activation_code must be 16-64 letters, digits and dashes; re-dispatch with a fresh code."
            exit 1
          fi
          echo "::add-mask::${code}"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate hold duration
        env:
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          case "${HOLD_MINUTES}" in
            0|15|60|120|240) ;;
            *)
              echo "::error::hold_minutes must be one of 0, 15, 60, 120, or 240; re-dispatch with a listed choice."
              exit 1
              ;;
          esac

      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install Ansible
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          . ./quality-tools.env
          runtime_venv="${RUNNER_TEMP}/aws-proof-venv"
          python3 -m venv "${runtime_venv}"
          "${runtime_venv}/bin/python" -m pip install --quiet --no-cache-dir \
            --requirement requirements-quality.txt
          "${runtime_venv}/bin/ansible-galaxy" collection install --force \
            --requirements-file requirements-quality.yml
          echo "${runtime_venv}/bin" >> "${GITHUB_PATH}"

      # The framework consumes a pre-existing key pair and never creates one, so the standing
      # account key pair named in terraform/aws.tfvars is the launch key. user_data installs its
      # public half by reading IMDS; only the private half is secret, and it exists solely in
      # this runner's temporary directory, mode 0600, for this one job.
      - name: Stage the launch private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/${CI_KEY_NAME}.pem"
          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${private_key}"
          staged_public="$(ssh-keygen -y -f "${private_key}")" \
            || { echo "::error::AWS_EC2_SSH_PRIVATE_KEY is not a usable private key."; exit 1; }
          echo "CI_PRIVATE_KEY=${private_key}" >> "${GITHUB_ENV}"
          echo "CI_STAGED_PUBLIC_KEY=${staged_public}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}
          role-duration-seconds: 7800

      # A rotated secret that no longer matches the launch key pair is invisible until Ansible
      # cannot log in — which surfaces fifteen minutes and one instance later as a readiness
      # timeout. Compare the two public halves here instead, before anything is created.
      - name: Assert the staged key matches the launch key pair
        run: |
          set -euo pipefail
          launch_public="$(aws ec2 describe-key-pairs --key-names "${CI_KEY_NAME}" \
            --include-public-key --query 'KeyPairs[0].PublicKey' --output text)"
          staged_material="$(awk '{print $1" "$2}' <<< "${CI_STAGED_PUBLIC_KEY}")"
          launch_material="$(awk '{print $1" "$2}' <<< "${launch_public}")"
          if [ "${staged_material}" != "${launch_material}" ]; then
            echo "::error::AWS_EC2_SSH_PRIVATE_KEY does not match EC2 key pair ${CI_KEY_NAME}." \
                 "The guest installs the key pair's public half, so SSH would fail after launch." \
                 "Rotate the secret to the matching private key, or repoint key_name."
            exit 1
          fi
          echo "staged key matches ${CI_KEY_NAME}"

      # actions/checkout cannot read a file into ref:, so validated immutable SHAs pass through
      # step outputs. Reject malformed/multiline pins before any external framework checkout.
      - name: Read framework pins
        id: pins
        run: |
          set -euo pipefail
          emit_pin() {
            local name="$1" path="$2" pin
            local -a lines
            mapfile -t lines < "${path}"
            [ "${#lines[@]}" -eq 1 ] || {
              echo "${path} must contain exactly one line" >&2
              return 1
            }
            pin="${lines[0]}"
            [[ "${pin}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "${path} must contain exactly one lowercase 40-character Git SHA" >&2
              return 1
            }
            printf '%s=%s\n' "${name}" "${pin}" >> "${GITHUB_OUTPUT}"
          }
          # Both framework pins live under .github/. The ansible pin is read by this workflow
          # and by scripts/compose-and-run.sh from one path, so local and CI can never diverge.
          emit_pin terraform .github/terraform-framework-pin
          emit_pin ansible .github/ansible-framework-pin

      - name: Checkout aws-terraform-framework (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/aws-terraform-framework
          ref: ${{ steps.pins.outputs.terraform }}
          path: .frameworks/aws-terraform-framework
          persist-credentials: false

      - name: Checkout ansible-framework (pinned)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/ansible-framework
          ref: ${{ steps.pins.outputs.ansible }}
          path: .frameworks/ansible-framework
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.1'
          terraform_wrapper: false

      - name: Discover and validate runner public IPv4
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS https://checkip.amazonaws.com)"
          ipv4_octet='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          if [[ ! "${runner_ip}" =~ ^${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}$ ]]; then
            echo "::error::Runner public address discovery did not return a bare IPv4 address."
            exit 1
          fi
          echo "::add-mask::${runner_ip}"
          echo "RUNNER_IP=${runner_ip}" >> "${GITHUB_ENV}"
          echo 'runner public IPv4 validated'

      # The operator's own address, so a held host can be reached directly rather than through a
      # tunnel. The secret carries a NAME, not an address: the name is stable and private, the
      # address behind it changes with the operator's connection, and resolving here means only
      # the address reaches Terraform -- masked in the log, exactly as the runner's is. The
      # address does reach Terraform state and the security group it builds; what no commit
      # records is the operator it belongs to.
      #
      # Absent secret means no operator access, not a failed run: the framework's debug_ip is
      # optional and a pipeline with nobody watching should grant nobody anything. A name that
      # is set and will not resolve DOES fail, because the alternative is a host that silently
      # cannot be reached by the person who asked for it.
      - name: Resolve the operator address for direct access
        env:
          DEBUG_HOSTNAME: ${{ secrets.AWS_DEBUG_HOSTNAME }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_HOSTNAME}" ]; then
            echo 'no operator hostname configured; this run grants no direct access'
            exit 0
          fi
          # `|| true` so the check below is the ONE gate: a name that does not resolve and a name
          # that resolves to something that is not an address fail the same way to a reader, and
          # without it the first kills the step on pipefail before this message can explain
          # itself. The check proves the SHAPE of an address, not that it is routable -- a name
          # pointing somewhere private yields a rule that simply reaches nobody.
          debug_ip="$(getent ahostsv4 "${DEBUG_HOSTNAME}" | awk '{ print $1; exit }' || true)"
          ipv4_octet='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          if [[ ! "${debug_ip}" =~ ^${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}\.${ipv4_octet}$ ]]; then
            echo "::error::The operator hostname did not resolve to a bare IPv4 address."
            exit 1
          fi
          echo "::add-mask::${debug_ip}"
          echo "DEBUG_IP=${debug_ip}" >> "${GITHUB_ENV}"
          echo 'operator IPv4 resolved and validated'

      - name: Terraform init
        id: tf-init
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          terraform init -input=false                                      \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-terraform"           \
            -backend-config="key=${{ github.repository }}/aws-poc.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # A killed predecessor can leave state and an instance whose one-time SSH private key no
      # longer exists. Never adopt it: destroy under the same lock, then apply with a fresh key.
      # A live/out-of-band lock makes this fail closed.
      - name: Remove interrupted predecessor state before apply
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve -lock-timeout=300s    \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "runner_ip=${RUNNER_IP}"                                    \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      # The value file comes FIRST and the identity flags after it. Terraform resolves repeated
      # command-line assignments in the order they are given, so this ordering -- not the kind of
      # flag -- is what stops the file from renaming who this fresh deployment says it is.
      - name: Terraform apply
        id: tf-apply
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=120s      \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "runner_ip=${RUNNER_IP}"                                    \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      # This repo's roles overlay onto the pinned framework tree. A framework-TRACKED role
      # path is refused so an overlay can never replace framework-owned code.
      - name: Compose the Ansible tree
        run: |
          set -euo pipefail
          # A role that runs a first-class PowerShell script tracks only files/<Name>.ps1.stub;
          # the script itself is developed and pair-tested under scripts/ and copied into place
          # here. This must precede the rsync below, which is what carries the materialized copy
          # into the composed tree.
          bash "${GITHUB_WORKSPACE}/scripts/materialize-role-scripts.sh"

          framework_dir="${GITHUB_WORKSPACE}/.frameworks/ansible-framework"

          # The framework's own roles track only files/<Name>.ps1.stub. Materialize them in the
          # checkout before the overlay: that materializer validates every stub it finds, and this
          # repository's roles resolve their sources from this repository, not from the framework.
          if [ -x "${framework_dir}/scripts/materialize-role-scripts.sh" ]; then
            (cd "${framework_dir}" && ./scripts/materialize-role-scripts.sh)
          fi

          for role_source in "${GITHUB_WORKSPACE}"/ansible/applications/*; do
            role_name="$(basename "${role_source}")"
            [ -f "${role_source}/tasks/main.yml" ] || { echo "!! missing tasks/main.yml in ${role_source}" >&2; exit 1; }
            [ -z "$(git -C "${framework_dir}" ls-files -- "applications/${role_name}/")" ] \
              || { echo "!! refusing framework-tracked role path applications/${role_name}" >&2; exit 1; }
            rsync -a --delete "${role_source}/" "${framework_dir}/applications/${role_name}/"
          done

      # The inventory supports an ssh-ssm transport; carrying the plugin keeps a transport change
      # in terraform/aws.tfvars from also needing a workflow change.
      - name: Install the pinned Session Manager plugin
        run: |
          set -euo pipefail
          . ./quality-tools.env
          plugin_base='https://s3.amazonaws.com/session-manager-downloads/plugin'
          plugin_deb="${RUNNER_TEMP}/session-manager-plugin.deb"
          plugin_path="${SESSION_MANAGER_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb"
          curl --fail --location --silent --show-error \
            "${plugin_base}/${plugin_path}" --output "${plugin_deb}"
          printf '%s  %s\n' "${SESSION_MANAGER_PLUGIN_DEB_SHA256}" "${plugin_deb}" \
            | sha256sum --check --strict
          sudo dpkg --install "${plugin_deb}"

      # Credential resolution, readiness, bootstrap, and the Nessus install, registration, HTTPS
      # and proofs are role-composed by the playbook. The EC2 inventory filters live instances to
      # this repository and workflow run.
      #
      # The budget is dominated by the first registration: it downloads the full plugin set and
      # the first start compiles it before the scanner reports ready. The role bounds that wait
      # itself; this bounds the whole converge above it, because the failure it guards against is
      # a hung converge -- and cutting a working one short reports a defect that is not there.
      - name: Run the Nessus playbook
        timeout-minutes: 90
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          # A secret reaches the shell through the environment, never by substitution into the
          # script text, so its value cannot be read as shell syntax. Forwarded on as an
          # extra-var below because the play requires it; same value the OIDC role ARN uses.
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          # NOT extra-vars: the dynamic inventory reads these from the environment to pick this
          # run's instance, and a lookup('env') has no command-line equivalent.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SKIP_PRODUCTS: ${{ inputs.skip_products }}
          # Masked by the first step. Only the four state=present converges are given it.
          NESSUS_ACTIVATION_CODE: ${{ inputs.activation_code }}
        run: |
          set -euo pipefail
          # Built as an array so an empty selection adds no argument at all, rather than an empty
          # string ansible-playbook would read as a tag named "".
          skip=()
          if [ "${SKIP_PRODUCTS:-false}" = 'true' ]; then
            skip=(--skip-tags products)
          fi
          # Dynamic inventory publishes an instance attribute named state; extra-vars take precedence.
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars env=test                                                 \
            --extra-vars state=present                                            \
            "${skip[@]}"                                                          \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"

      # The first converge can consume most of the job's first session; the proofs below run on a
      # fresh one rather than on whatever remains of it.
      - name: Refresh AWS credentials for the proofs (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-proofs
          role-duration-seconds: 3600

      # Idempotency gate: a settled host reports NO change on a second converge. Everything the
      # scanner play writes -- the role's package, settings, certificate, registration and account,
      # and the play's nftables ruleset and services -- is read first and written only on
      # difference. The gate judges the host's whole recap, the host roles included, so any change
      # here is drift the converge failed to settle, or a write it cannot judge.
      - name: Prove a second converge changes nothing
        if: ${{ !inputs.skip_products }}
        timeout-minutes: 30
        working-directory: .frameworks/ansible-framework
        # The same environment every composed-tree invocation below repeats: dynamic inventory
        # reads the ids, the plays take the account, and the config points at the composed tree.
        # Spelled out rather than anchored, because the fleet's pinned actionlint rejects aliases.
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NESSUS_ACTIVATION_CODE: ${{ inputs.activation_code }}
        run: |
          set -euo pipefail
          recap="$(ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"       \
            --extra-vars env=test                                                 \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars state=present 2>&1 | tee /dev/stderr)"
          # The controller answers the inventory-contract play and reports changed=0 on its own
          # recap line; judging it would let it satisfy the rule for a host that changed.
          hosts="$(printf '%s\n' "${recap}" \
            | grep -E '^[^ ]+ +: +ok=[0-9]+' | grep -vE '^localhost +:' || true)"
          if [ -z "${hosts}" ]; then
            echo "::error::no play recap found -- the converge did not run to a recap" >&2
            exit 1
          fi
          # Counted, not matched with grep -q -v: implementations disagree on the exit status of
          # an inverted quiet match, and a health gate must not depend on which grep is installed.
          busy="$(printf '%s\n' "${hosts}" | grep -cvE 'changed=0 +unreachable=0 +failed=0\b' || true)"
          if [ "${busy}" -ne 0 ]; then
            echo "::error::second converge: ${busy} host(s) changed something or failed" >&2
            exit 1
          fi
          echo "second converge: every scanner reported changed=0"

      # OS-DRIVE REPLACEMENT proof (opt-in). Bumping refresh_serial replaces the OS instance in
      # place while the STANDALONE data volume detaches and re-attaches to the replacement; the
      # scanner must then resume on its existing install root. Before the replacement a record is
      # written into Nessus's own database, and after it the record must read back: it exists only
      # in the database on the data volume, so reading it back proves the volume moved AND that
      # Nessus opened its existing database rather than starting a new one. A second post-swap
      # converge must then report no change -- the same idempotency proof, on a rebuilt host.
      - name: Refresh AWS credentials for the OS replacement (OIDC)
        if: inputs.os_swap
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-os-swap
          role-duration-seconds: 3600

      - name: Write a record into the scanner's database before the OS is replaced
        if: inputs.os_swap
        timeout-minutes: 15
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --tags nessus_data_proof                                              \
            --extra-vars nessus_data_proof=mark                                   \
            --extra-vars nessus_data_proof_marker="${GITHUB_RUN_ID}"              \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars env=test                                                 \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"

      - name: Replace the OS drive, keeping the data volume (refresh_serial bump)
        if: inputs.os_swap
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=120s      \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "environment=test"                                          \
            -var "refresh_serial=1"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "runner_ip=${RUNNER_IP}"                                    \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      # The OS is new, so this is a first converge again: the disk role adopts the labelled volume
      # without formatting it, and the scanner role adopts the scanner on it, reinstalling the
      # package over the install root and requiring the scanner's identity to come through
      # unchanged. Tenable ties the registration to the machine, so it registers again here.
      - name: Re-converge onto the re-attached data volume
        if: inputs.os_swap
        timeout-minutes: 90
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NESSUS_ACTIVATION_CODE: ${{ inputs.activation_code }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars env=test                                                 \
            --extra-vars state=present                                            \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"

      - name: Refresh AWS credentials after the re-converge (OIDC)
        if: inputs.os_swap
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-os-swap-proofs
          role-duration-seconds: 3600

      - name: Prove the scanner resumed on its own data
        if: inputs.os_swap
        timeout-minutes: 15
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --tags nessus_data_proof                                              \
            --extra-vars nessus_data_proof=verify                                 \
            --extra-vars nessus_data_proof_marker="${GITHUB_RUN_ID}"              \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars env=test                                                 \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"

      - name: Prove the rebuilt host converges without change
        if: inputs.os_swap
        timeout-minutes: 30
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NESSUS_ACTIVATION_CODE: ${{ inputs.activation_code }}
        run: |
          set -euo pipefail
          recap="$(ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"       \
            --extra-vars env=test                                                 \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars state=present 2>&1 | tee /dev/stderr)"
          hosts="$(printf '%s\n' "${recap}" \
            | grep -E '^[^ ]+ +: +ok=[0-9]+' | grep -vE '^localhost +:' || true)"
          if [ -z "${hosts}" ]; then
            echo "::error::no play recap found -- the converge did not run to a recap" >&2
            exit 1
          fi
          busy="$(printf '%s\n' "${hosts}" | grep -cvE 'changed=0 +unreachable=0 +failed=0\b' || true)"
          if [ "${busy}" -ne 0 ]; then
            echo "::error::post-swap converge: ${busy} host(s) changed something or failed" >&2
            exit 1
          fi
          echo "post-swap converge: the rebuilt scanner reported changed=0"

      - name: Prove state=absent removes the scanner
        if: inputs.absent_proof
        timeout-minutes: 30
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"       \
            --extra-vars env=test                                                 \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars state=absent

      - name: Prove state=absent is idempotent (second run is a no-op)
        if: inputs.absent_proof
        timeout-minutes: 30
        working-directory: .frameworks/ansible-framework
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.frameworks/ansible-framework/ansible.cfg
          ANSIBLE_SSH_AGENT: auto
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          recap="$(ansible-playbook "${GITHUB_WORKSPACE}/ansible/playbooks/nessus-aws.yml" \
            --inventory "${GITHUB_WORKSPACE}/ansible/inventory/aws_ec2.yml"       \
            --extra-vars env=test                                                 \
            --extra-vars aws_account_id="${AWS_ACCOUNT_ID}"                       \
            --extra-vars aws_region="${AWS_REGION}"                               \
            --extra-vars state=absent 2>&1 | tee /dev/stderr)"
          hosts="$(printf '%s\n' "${recap}" \
            | grep -E '^[^ ]+ +: +ok=[0-9]+' | grep -vE '^localhost +:' || true)"
          if [ -z "${hosts}" ]; then
            echo "::error::no play recap found -- the second state=absent run did not reach a recap" >&2
            exit 1
          fi
          busy="$(printf '%s\n' "${hosts}" | grep -cvE 'changed=0 +unreachable=0 +failed=0\b' || true)"
          if [ "${busy}" -ne 0 ]; then
            echo "::error::second state=absent run: ${busy} host(s) changed something or failed" >&2
            exit 1
          fi
          echo "second state=absent run reported changed=0"

      - name: Hold the converged guest for interactive work
        if: >-
          !cancelled() &&
          inputs.hold_minutes != '0' &&
          steps.tf-apply.outcome == 'success'
        timeout-minutes: 245
        env:
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
        run: |
          set -euo pipefail
          instance_id="$(
            aws ec2 describe-instances \
              --filters "Name=tag:RepositoryId,Values=${GITHUB_REPOSITORY_ID}" \
                        "Name=tag:RunId,Values=${GITHUB_RUN_ID}" \
                        "Name=tag:Repository,Values=${GITHUB_REPOSITORY}" \
                        "Name=tag:Environment,Values=test" \
                        "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text 2>/dev/null || true
          )"
          if [[ ! "${instance_id}" =~ ^i-[0-9a-f]+$ ]]; then
            instance_id='unavailable'
          fi

          remaining_minutes="${HOLD_MINUTES}"
          echo "Holding EC2 instance ${instance_id} for ${remaining_minutes} minutes."
          echo "Reach Nessus with: ssh -L 8834:localhost:8834 ec2-user@<its public IPv4>, then https://localhost:8834"
          while (( remaining_minutes > 0 )); do
            sleep 300
            remaining_minutes=$((remaining_minutes - 5))
            echo "Hold heartbeat for EC2 instance ${instance_id}: ${remaining_minutes} minutes remaining."
          done
          exit 0

      - name: Refresh AWS credentials for teardown (OIDC)
        if: always() && steps.tf-init.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          role-session-name: aws-deploy-${{ github.run_id }}-teardown
          role-duration-seconds: 3600

      # Gated on INIT, not apply: a failed apply still leaves state to tear down.
      - name: Terraform destroy (always)
        id: tf-destroy
        if: >-
          always() &&
          steps.tf-init.outcome == 'success'
        timeout-minutes: 15
        working-directory: .frameworks/aws-terraform-framework/terraform
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve -lock-timeout=300s    \
            -var-file="${GITHUB_WORKSPACE}/terraform/aws.tfvars"             \
            -var "commit_sha=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" \
            -var "environment=test"                                          \
            -var "repository=${GITHUB_REPOSITORY}"                           \
            -var "repository_id=${GITHUB_REPOSITORY_ID}"                     \
            -var "run_id=${GITHUB_RUN_ID}"                                   \
            -var "runner_ip=${RUNNER_IP}"                                    \
            ${DEBUG_IP:+-var "debug_ip=${DEBUG_IP}"}

      - name: Remove the ephemeral private key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${CI_PRIVATE_KEY:-}" ]; then
            rm -f -- "${CI_PRIVATE_KEY}"
          fi

  report:
    name: AWS lifecycle incident
    needs: [main-ref, aws-deploy]
    if: always() && needs.main-ref.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      INCIDENT_LABEL: automation-incident
      INCIDENT_MARKER: '<!-- nessus-automation:aws-lifecycle -->'
      INCIDENT_TITLE: '[automation] AWS lifecycle proof failed'
      LIFECYCLE_RESULT: ${{ needs.aws-deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Update or resolve the lifecycle incident
        run: |
          set -euo pipefail

          gh label create "${INCIDENT_LABEL}" --repo "${GITHUB_REPOSITORY}" --force \
            --color B60205 --description 'Owned exclusively by recurring automation incidents' > /dev/null
          issue_json="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state all --limit 100 \
            --label "${INCIDENT_LABEL}" --json number,title,body,author,state)"
          mapfile -t issue_numbers < <(jq -r --arg title "${INCIDENT_TITLE}" \
            --arg marker "${INCIDENT_MARKER}" '
              [.[] | select(
                .title == $title
                and .author.login == "app/github-actions"
                and ((.body // "") | contains($marker))
              )] | sort_by(.number) | .[].number
            ' <<< "${issue_json}")
          issue_number="${issue_numbers[0]:-}"
          for duplicate in "${issue_numbers[@]:1}"; do
            if [ "$(gh issue view "${duplicate}" --repo "${GITHUB_REPOSITORY}" \
              --json state --jq .state)" = OPEN ]; then
              gh issue close "${duplicate}" --repo "${GITHUB_REPOSITORY}" --reason duplicate \
                --comment "Deduplicated into automation-owned incident #${issue_number}."
            fi
          done

          if [ "${LIFECYCLE_RESULT}" = success ]; then
            if [ -n "${issue_number}" ] && \
              [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = OPEN ]; then
              gh issue close "${issue_number}" --repo "${GITHUB_REPOSITORY}" \
                --reason completed --comment "Recovered in ${RUN_URL}."
            else
              echo "Lifecycle is healthy; no open incident to resolve."
            fi
            exit 0
          fi

          message="Lifecycle result: ${LIFECYCLE_RESULT}. Inspect ${RUN_URL}."
          message="${message} Cleanup was attempted when initialization succeeded;"
          message="${message} inspect the destroy and post-cleanup steps."
          if [ -z "${issue_number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --label "${INCIDENT_LABEL}" --title "${INCIDENT_TITLE}" \
              --body "$(printf '%s\n\n%s' "${INCIDENT_MARKER}" "${message}")"
          else
            if [ "$(gh issue view "${issue_number}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state)" = CLOSED ]; then
              gh issue reopen "${issue_number}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body "${message}"
          fi
