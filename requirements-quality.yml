---
# Collections used while linting the composed application + pinned framework tree.
collections:
  - name: amazon.aws
    version: '11.4.0'
  - name: ansible.windows
    version: '3.7.0'
  - name: community.windows
    version: '3.3.0'
  # The framework's domain_member role performs its Windows join through microsoft.ad.
  - name: microsoft.ad
    version: '1.12.0'
  # The framework's linux_disk_manager partitions and formats the data volume through
  # community.general (parted, filesystem) and mounts it through ansible.posix (mount). Pinned to
  # the versions the framework's own requirements.yml declares at the pinned commit.
  - name: community.general
    version: '7.5.9'
  - name: ansible.posix
    version: '1.6.2'
